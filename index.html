<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">Estudante Exemplo | 8º Ano</p>
  </header>

  <main class="conteudo-principal">
    
    <!-- Seção dos Cards de Resumo -->
    <section class="secao-cards">
      <div class="card card-media">
        <h3>Média Geral</h3>
        <p id="card-media-val">—</p>
      </div>

      <div class="card card-faltas">
        <h3>Total de Faltas</h3>
        <p id="card-faltas-val">—</p>
      </div>

      <div class="card card-bom">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-val">—</p>
      </div>

      <div class="card card-atencao">
        <h3>Precisa de Atenção</h3>
        <p id="card-atencao-val">—</p>
      </div>

      <div class="card card-frequencia">
        <h3>Frequência Geral</h3>
        <p id="card-frequencia-val">92%</p>
        <span class="status-freq">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <section class="secao-tabela">
      <h2>Notas e Desempenho por Disciplina</h2>
      
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas automaticamente pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
